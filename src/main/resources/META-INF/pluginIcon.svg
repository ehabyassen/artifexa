<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6FA8FF"/>
      <stop offset="1" stop-color="#3F6ED9"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34E3B5"/>
      <stop offset="1" stop-color="#1AA985"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB74D"/>
      <stop offset="1" stop-color="#E08A1B"/>
    </linearGradient>
  </defs>

  <!-- rounded square backdrop -->
  <rect x="1" y="1" width="38" height="38" rx="8" ry="8"
        fill="#1F2329" stroke="#3C414A" stroke-width="1"/>

  <!-- edges first so nodes paint over them -->
  <g stroke="#8FA6C9" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.85">
    <line x1="11" y1="13" x2="28" y2="12"/>
    <line x1="11.5" y1="14" x2="20" y2="28"/>
    <line x1="28" y1="13" x2="20.5" y2="28"/>
  </g>

  <!-- three nodes forming an 'A' triangle -->
  <circle cx="11" cy="13" r="4.4" fill="url(#g1)" stroke="#E8EEF9" stroke-width="0.8"/>
  <circle cx="28" cy="12" r="4.4" fill="url(#g3)" stroke="#E8EEF9" stroke-width="0.8"/>
  <circle cx="20" cy="28" r="5.2" fill="url(#g2)" stroke="#E8EEF9" stroke-width="0.8"/>

  <!-- subtle spark on the lead node to suggest AI review -->
  <g fill="#FFFFFF" opacity="0.9">
    <circle cx="20" cy="28" r="0.9"/>
    <path d="M23.5 25.5 l1.1 -0.3 l-0.3 1.1 l-0.8 -0.8 z"/>
  </g>
</svg>
